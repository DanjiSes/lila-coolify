# Lichess (lila-docker quick) — tailored for Coolify
#
# Differences from upstream quick/compose.yml:
# - Caddy does NOT bind 0.0.0.0:80 (Coolify/Traefik already use host 80/443)
# - Caddy only exposes port 80 on the project network; assign Coolify’s domain
#   to the *caddy* service, port 80 (container)
# - Caddy / lila / picfit are built with small Dockerfiles that COPY conf/* into the
#   image (avoids file bind mounts when the host path is wrong/missing; common on Coolify)
#
# In Coolify → Environment, set (example):
#   LILA_URL=https://lichess.example.com
#   LILA_DOMAIN=lichess.example.com
#
# Source: https://github.com/lichess-org/lila-docker/tree/main/quick

name: lichess

services:
  caddy:
    build:
      context: .
      dockerfile: caddy.Dockerfile
    image: lila-coolify-caddy:local
    # Required on Coolify: do not use "ports: - 80:80" here
    expose:
      - "80"
    environment:
      - LILA_DOMAIN=${LILA_DOMAIN:-localhost}
      - LILA_URL=${LILA_URL:-http://localhost}
    restart: unless-stopped

  lila:
    build:
      context: .
      dockerfile: lila.Dockerfile
    image: lila-coolify-lila:local
    environment:
      - LILA_DOMAIN=${LILA_DOMAIN:-localhost}
      - LILA_URL=${LILA_URL:-http://localhost}
    volumes:
      - lila-assets-data:/lila/public
    restart: unless-stopped

  lila_assets:
    image: ghcr.io/lichess-org/lila-assets:latest
    volumes:
      - lila-assets-data:/usr/share/nginx/html/public
    restart: unless-stopped

  lila_ws:
    image: ghcr.io/lichess-org/lila-ws:latest
    environment:
      - CONFIG_FORCE_csrf.origin=${LILA_URL:-http://localhost}
      - CONFIG_FORCE_mongo_uri=mongodb://mongodb:27017/lichess?appName=lila-ws
      - CONFIG_FORCE_redis.uri=redis://redis
    restart: unless-stopped

  mongodb:
    image: mongo:8.2-noble
    restart: unless-stopped

  redis:
    image: redis:8
    restart: unless-stopped

  lila_fishnet:
    image: ghcr.io/lichess-org/lila-fishnet:latest
    environment:
      - REDIS_HOST=redis
    restart: unless-stopped

  fishnet_play:
    image: niklasf/fishnet:master
    environment:
      - ENDPOINT=http://lila_fishnet:9665/fishnet
      - MAX_BACKOFF=5
      - STATS_FILE=/stats.json
    restart: unless-stopped

  fishnet_analysis:
    image: niklasf/fishnet:master
    environment:
      - ENDPOINT=http://lila:9663/fishnet
      - MAX_BACKOFF=5
      - STATS_FILE=/stats.json
    restart: unless-stopped

  lila_gif:
    image: ghcr.io/lichess-org/lila-gif:latest
    entrypoint: /usr/local/bin/lila-gif --bind 0.0.0.0:6175
    restart: unless-stopped

  lila_db_seed:
    image: ghcr.io/lichess-org/lila-db-seed:latest
    # One-off seed: do not set restart: unless-stopped
    restart: "no"

  picfit:
    build:
      context: .
      dockerfile: picfit.Dockerfile
    image: lila-coolify-picfit:local
    environment:
      - PICFIT_CONFIG_PATH=/mnt/config.json
    restart: unless-stopped

  mailpit:
    image: axllent/mailpit:latest
    environment:
      - MP_WEBROOT=mailpit
    restart: unless-stopped

volumes:
  lila-assets-data: null

networks:
  default:
    driver: ${NETWORK_DRIVER:-bridge}
    attachable: true
